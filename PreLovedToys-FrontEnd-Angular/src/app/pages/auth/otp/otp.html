<div class="otp-container">
    <!-- Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="content-wrapper">
        <div class="header-section">
            <div class="logo-container">
                <span class="logo-icon">🔒</span>
            </div>
            <h1>Verify OTP</h1>
            <p>We've sent a code to +91 {{ mobile }}</p>
            <a (click)="changeMobile()" class="change-number">Change Number</a>
        </div>

        <form class="form-section" (ngSubmit)="verify()">
            <div class="otp-inputs">
                @for (d of digits(); track $index) {
                    <input #box type="tel" inputmode="numeric" autocomplete="one-time-code" class="otp-box"
                        [value]="d" (input)="onInput($event, $index)" (keydown)="onKeydown($event, $index)"
                        [attr.aria-label]="'Digit ' + ($index + 1)">
                }
            </div>

            @if (error()) {
                <p class="form-error" role="alert">{{ error() }}</p>
            }

            <div class="timer-section">
                @if (seconds() > 0) {
                    <p class="timer-text">Resend code in <span>{{ seconds() }}s</span></p>
                } @else {
                    <p class="resend-text">Didn't receive code? <a (click)="resend()">Resend</a></p>
                }
            </div>

            <button type="submit" class="submit-btn" [disabled]="loading() || otp.length < 4">
                @if (loading()) {
                    <span class="loader"></span>
                } @else {
                    <span>Verify & Sign in</span>
                }
            </button>
        </form>
    </div>
</div>
