<div class="login-container">
    <!-- Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="content-wrapper">
        <div class="header-section">
            <div class="logo-container">
                <span class="logo-icon">🧸</span>
            </div>
            <h1>PreLoved Toys</h1>
            <p>Admin portal</p>
        </div>

        <form class="form-section" (ngSubmit)="sendOtp()">
            <div class="input-group">
                <label for="mobile">Admin mobile number</label>
                <div class="input-wrapper">
                    <span class="input-icon">📱</span>
                    <input #mobileInput type="tel" id="mobile" name="mobile" [ngModel]="mobile()" (ngModelChange)="onMobileInput($event)"
                        placeholder="Enter 10-digit number" maxlength="10" inputmode="numeric" autocomplete="tel"
                        class="custom-input">
                </div>
            </div>

            @if (error()) {
                <p class="form-error" role="alert">{{ error() }}</p>
            }

            <button type="submit" class="submit-btn" [disabled]="loading() || !mobile()">
                @if (loading()) {
                    <span class="loader"></span>
                } @else {
                    <span>Send OTP</span>
                }
            </button>

            <p class="terms-text">Only accounts with the admin role can sign in here.</p>
        </form>
    </div>
</div>
